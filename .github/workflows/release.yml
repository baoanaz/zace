# 发布 zace-client 的多平台二进制（npm 包装器按 tag 从这里下载）。
#
# 触发：推送 v* tag。产物命名必须与 npm/run.js 的 assetName() 一一对应——
# 改一处必须改两处（asset_name 是两者的唯一约定）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: zace-client_Linux_x86_64.tar.gz
            binary_name: zace-client
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_name: zace-client_Linux_aarch64.tar.gz
            binary_name: zace-client
          - os: macos-latest
            target: universal-apple-darwin
            asset_name: zace-client_Darwin_universal.tar.gz
            binary_name: zace-client
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: zace-client_Windows_x86_64.zip
            binary_name: zace-client.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_name: zace-client_Windows_aarch64.zip
            binary_name: zace-client.exe

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            ${{ matrix.target == 'universal-apple-darwin'
                && 'x86_64-apple-darwin,aarch64-apple-darwin'
                || matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: Build (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          lipo -create \
            -output target/release/${{ matrix.binary_name }} \
            target/x86_64-apple-darwin/release/${{ matrix.binary_name }} \
            target/aarch64-apple-darwin/release/${{ matrix.binary_name }}

      - name: Build
        if: matrix.target != 'universal-apple-darwin'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.target != 'universal-apple-darwin' && !contains(matrix.target, 'windows')
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/${{ matrix.asset_name }}" ${{ matrix.binary_name }}

      - name: Package (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: |
          cd target/release
          tar czf "$GITHUB_WORKSPACE/${{ matrix.asset_name }}" ${{ matrix.binary_name }}

      - name: Package (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" `
            -DestinationPath "$env:GITHUB_WORKSPACE/${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
