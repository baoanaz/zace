name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: python (core + service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages --all-extras
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Dependency direction check (D-33/D-34/D-35)
        run: uv run python scripts/check_dependency_direction.py
      - name: Tests
        run: uv run pytest
