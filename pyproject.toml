# zace workspace 根配置（虚拟根，非包；包成员见 core/ 与 service/）
# 用法：uv sync --all-packages --all-extras

[tool.uv.workspace]
members = ["core", "service"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "client", "web", "benches/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "service/tests"]
addopts = "-q"
